<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 104" width="1280" height="104" role="img" aria-label="What's new">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#03060f"/>
      <stop offset="0.5" stop-color="#0b1024"/>
      <stop offset="1" stop-color="#03060f"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B6B" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#FF6B6B" stop-opacity="0.95"/>
      <stop offset="0.62" stop-color="#6C63FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6C63FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B6B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF6B6B" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FF6B6B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF6B6B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF6B6B" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#6C63FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="104" fill="url(#g)"/>
  <rect width="1280" height="104" fill="url(#grid)"/>
  <ellipse cx="86" cy="52" rx="150" ry="58" fill="url(#glow)" filter="url(#soft)"/>

  <!-- travelling highlight -->
  <g>
    <rect x="-360" y="0" width="360" height="104" fill="url(#sweep)"/>
    <animateTransform attributeName="transform" type="translate"
                      values="0,0;1660,0" dur="8s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(52,52)">
    <circle r="21" fill="none" stroke="#FF6B6B" stroke-opacity="0.85" stroke-width="1.6"/>
    <circle r="27" fill="none" stroke="#FF6B6B" stroke-opacity="0.25" stroke-width="1">
      <animate attributeName="r" values="27;31;27" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.25;0.05;0.25" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="7" font-size="19" text-anchor="middle" fill="#FF6B6B">★</text>
  </g>

  <text x="98" y="46" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700"
        fill="#E8ECFF" letter-spacing="0.5">What's new</text>
  <text x="99" y="70" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" fill="#8892b8">v1.0.1 — a run that stopped short says so</text>

  <rect x="98" y="84" width="1130" height="1.6" fill="url(#rule)"/>
</svg>
