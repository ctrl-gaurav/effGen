# ---------------------------------------------------------------------------
# Use-case extras (curated groupings for common install intents). The base
# install already excludes the heavy optional stacks (vLLM, vector DBs, OCR,
# OpenCV, spaCy/Stanza); these named extras let users pull exactly the slice
# they need instead of the everything-extra [all].
# ---------------------------------------------------------------------------
api = [
    # Hosted-inference provider SDKs (openai/anthropic/google are already in the
    # base install). Pick this when you only call cloud models, no local stack.
    "groq>=0.15",
    "together>=1.3",
    "fireworks-ai>=0.15,<0.18",
    # h2 reaches the install through fireworks-ai -> betterproto-fw -> grpclib;
    # 4.4.1 is the first release that clears PYSEC-2026-3628.
    "h2>=4.4.1",
    "replicate>=1.0",
    "cerebras-cloud-sdk>=1.0",
    "huggingface_hub>=0.26",
    # via together / fireworks-ai
    "Pillow>=12.3.0",
]
local = [
    # Run/quantize local Transformers models on GPU (torch/transformers/accelerate
    # ship in the base install; this adds the quantization + GGUF backends).
    "bitsandbytes>=0.46.1",
    "llama-cpp-python>=0.2.0",
]
grammar = [
    # Grammar-constrained (schema-guaranteed) decoding for LOCAL Transformers
    # models. With this installed, structured output is produced in one
    # constrained pass, so even weak JSON-followers (small Llama/Gemma/Phi
    # locals) emit schema-valid output instead of falling back to prompt-and-
    # validate. Entirely optional: without it, structured output still works via
    # the universal prompt+validate path (it just can't *guarantee* conformance
    # on a model that won't follow the schema). The grammar code probes the
    # concrete outlines symbols it needs, so an incompatible build degrades to
    # the fallback rather than erroring.
    "outlines>=1.0",
    # via outlines
    "Pillow>=12.3.0",
]
tools-web = [
    # Web-search / browsing tools (DuckDuckGo ships in the base install).
    "google-search-results>=2.4.2",
    "google-api-python-client>=2.108.0",
    # httplib2 reaches the install through google-api-python-client;
    # 0.32.0 is the first release that clears PYSEC-2026-3444.
    "httplib2>=0.32.0",
