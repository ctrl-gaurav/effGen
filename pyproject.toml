[build-system]
# setuptools>=77 is required for PEP 639 license expressions (the SPDX
# `license = "Apache-2.0"` string below). Older setuptools rejects it with
# "invalid pyproject.toml config: project.license", which surfaces on
# `pip install -e . --no-build-isolation` against an env with an older
# setuptools (default isolated installs fetch a recent build backend and work).
requires = ["setuptools>=77.0.0", "wheel>=0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "effgen"
dynamic = ["version"]
description = "A comprehensive framework for building agents with Small Language Models"
readme = "README_PYPI.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "Gaurav Srivastava", email = "gks@vt.edu"}
]
maintainers = [
    {name = "Gaurav Srivastava", email = "gks@vt.edu"}
]
keywords = [
    "ai", "agents", "llm", "slm", "language-models", "small-language-models",
    "tool-use", "function-calling", "prompt-engineering", "multi-agent",
    "agent-framework", "transformers", "vllm", "openai", "anthropic", "gemini",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

dependencies = [
    # Deep Learning & Model Support
    # Upper bounds cap fast-moving majors at the last line validated for this
    # release so a fresh install never silently pulls an untested next major
    # (torch 3.x / transformers 6.x). The "latest deps" CI lane tests above these.
    "torch>=2.0.0,<3.0",
    "transformers>=4.35.0,<6",
    "accelerate>=0.24.0",
    "safetensors>=0.4.0",
    "sentencepiece>=0.1.99",
    # protobuf pinned >= patched release per CVE-2025-4565 / CVE-2026-0994
    "protobuf>=5.29.5",
    # API Model Adapters
    "openai>=1.3.0",
    "anthropic>=0.7.0",
    "google-generativeai>=0.3.0",
    "google-genai>=1.0.0",
    # Anchor the google + protobuf client stack to modern floors. Without these,
    # the google-* trio (generativeai + genai + api-python-client) — combined
    # with the protobuf>=5.29.5 CVE pin and reward-kit/fireworks-ai's overlapping
    # google/grpc requirements — lets pip backtrack through the entire
    # google-auth / google-api-core / proto-plus / grpcio-status version history,
    # exploding the resolution graph and triggering pip's `resolution-too-deep`
    # error (reproduced in CI and on a clean local install). These floors keep
    # the resolver shallow without changing the versions it ultimately picks.
    "google-auth>=2.28.0",
    "google-api-core>=2.24.0",
    "cachetools>=5.3.0",
    "proto-plus>=1.24.0",
    "grpcio-status>=1.60.0",
    "googleapis-common-protos>=1.63.0",
    # httplib2 reaches the base install through google-generativeai ->
    # google-api-python-client; 0.32.0 is the first release that clears
    # PYSEC-2026-3444.
    "httplib2>=0.32.0",
    # pyasn1 reaches the base install through google-auth -> pyasn1-modules;
    # 0.6.4 is the first release that clears CVE-2026-59885/-59886.
    "pyasn1>=0.6.4",
    # Configuration Management
    "pyyaml>=6.0.1",
    "jsonschema>=4.19.0",
    "json5>=0.9.14",
    "python-dotenv>=1.0.0",
    # Tool Support & HTTP
    "requests>=2.31.0",
    # aiohttp>=3.14.3 clears CVE-2026-34993 / CVE-2026-47265 and the six
    # advisories still open against 3.14.1, fixed across 3.14.2 and 3.14.3.
    "aiohttp>=3.14.3",
    "httpx>=0.25.0",
    # Web Search
    "duckduckgo-search>=8.1.0",
    "ddgs>=9.9.3",
    # File Operations & Code Execution
    "docker>=6.1.0",
    "nbformat>=5.9.0",
    "jupyter-client>=8.5.0",
    # Utilities
    "numpy>=1.24.0,<3",
    "pandas>=2.0.0,<4",
    "pydantic>=2.0.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "colorama>=0.4.6",
    "jinja2>=3.1.0",
    # Async Support
    "asyncio-throttle>=1.0.1",
    "nest-asyncio>=1.5.8",
    # Logging & Monitoring
    "loguru>=0.7.0",
    # GPU Management
    "gputil>=1.4.0",
    "nvidia-ml-py>=11.495.46",
    # Protocol Support - MCP
    # 1.28.1 is the first release that clears CVE-2026-59950. The 2.x line
    # removes `mcp.server.fastmcp` (which the effGen MCP server is built on),
    # drops the `streamablehttp_client` alias and restructures `mcp.types`, so
    # it needs a port rather than a version bump.
    "mcp>=1.28.1,<2",
    # Performance Monitoring
    "psutil>=5.9.0",
    # Data Processing
    "tiktoken>=0.5.0",
    "scikit-learn>=1.3.0",
    # Security
    # >=50.0.0 clears the advisories open against 48.0.1, fixed across the
    # 49.0.0 and 50.0.0 releases.
    "cryptography>=50.0.0",
    # starlette pinned >= patched release (transitively pulled by fastapi).
    # 1.3.1 is the minimum that clears all currently-known advisories:
    #   - PYSEC-2026-161               (host-header injection)
    #   - CVE-2026-54282 / GHSA-jp82-jpqv-5vv3  (URL authority poisoning, fixed 1.3.0)
    #   - CVE-2026-54283 / GHSA-82w8-qh3p-5jfq  (form() limit DoS, fixed 1.3.1)
    # Upper bound caps the next major (2.x) which is untested for this release.
    "starlette>=1.3.1,<2.0",
    # API Server
    # 0.136.3 is excluded: that release was flagged malicious (MAL-2026-4750)
    # and injects an undocumented 'fastar' dependency. The <0.140 ceiling keeps
    # fresh installs on the FastAPI line validated for this release.
    "fastapi>=0.109.0,<0.140,!=0.136.3",
    "uvicorn>=0.27.0",
]

[project.urls]
Homepage = "https://effgen.org/"
Documentation = "https://effgen.org/docs/"
Repository = "https://github.com/ctrl-gaurav/effGen"
"Bug Tracker" = "https://github.com/ctrl-gaurav/effGen/issues"
Changelog = "https://github.com/ctrl-gaurav/effGen/blob/main/CHANGELOG.md"

[project.scripts]
effgen = "effgen.cli:main"
effgen-agent = "effgen.cli:agent_main"
effgen-web = "effgen.cli:web_agent_main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.2.0",
    "pytest-forked>=1.6.0",
    # Randomized test ordering catches cross-test isolation regressions (a test
    # that only fails depending on what ran before it). Used by the
    # order-independence CI lane; see docs/guides/testing.md.
    "pytest-randomly>=3.12.0",
    "pexpect>=4.9.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    "bitsandbytes>=0.46.1",
    "hypothesis>=6.100.0",
    # The benchmark replay instrument (tests/benchmarks/agentloop) scores memory
    # sets with a stemmer from nltk; without it those cells refuse to score.
    "nltk>=3.8.0",
    "cyclonedx-bom>=4.0.0",
    # Local supply-chain auditing so the security gate (tests/security/
    # test_vuln_audit.py) is runnable from a dev install, matching the CI gate.
    "pip-audit>=2.7.0",
]
# vLLM pins one EXACT torch version per release, and that torch build fixes the
# CUDA runtime. A Python extra cannot express "the torch that matches your
# driver", so on a CUDA-12 box `pip install effgen[vllm]` (latest vLLM) pulls a
# CUDA-13 torch and disables the GPU. Install vLLM against your driver's torch
# build per docs/installation.md ("Installing vLLM"); engine="auto-fast" falls
# back to Transformers if the installed vLLM can't import.
vllm = [
    "vllm>=0.2.7,<1.0",
    # via vllm / mistral-common / torchvision
    "Pillow>=12.3.0",
]
mlx = [
    "mlx>=0.16.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.18.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
mlx-vlm = [
    "mlx>=0.16.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.18.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-vlm>=0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
rag = [
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
]
finance = [
    "yfinance>=0.2.31",
]
data = [
    "matplotlib>=3.7.0",
    "plotly>=5.18.0",
    # via matplotlib
    "Pillow>=12.3.0",
]
eval = [
    "rouge-score>=0.1.2",
    "nltk>=3.8.0",
