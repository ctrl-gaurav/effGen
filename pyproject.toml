    "effgen[server]",
]
tools = [
    "pytesseract>=0.3.10",
    # Pillow 12.3.0 is the first release clear of the imaging advisories
    # (PYSEC-2026-2253..-2257, -3451..-3453, CVE-2026-54058/-59197/-59198/
    # -59200/-59204). Every extra whose dependency closure reaches Pillow —
