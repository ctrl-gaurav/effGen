    "faiss-cpu>=1.7.4",
    "chromadb>=0.4.18",
    "qdrant-client>=1.7.0",
    "duckduckgo-search>=8.1.0",
    "google-search-results>=2.4.2",
    "google-api-python-client>=2.108.0",
    # httplib2 reaches the install through google-api-python-client;
    # 0.32.0 is the first release that clears PYSEC-2026-3444.
    "httplib2>=0.32.0",
    "boto3>=1.28.0",
    "hvac>=1.2.0",
    "azure-keyvault-secrets>=4.7.0",
    "azure-identity>=1.14.0",
    "wandb>=0.16.0",
    # gitpython reaches the install through wandb; 3.1.58 is the first release
    # that clears the eight advisories open against 3.1.56, fixed across
