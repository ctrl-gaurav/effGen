    "feedparser>=6.0.11",
    "youtube-transcript-api>=1.0.0",
    # 2026.7.4 is the first release that clears CVE-2026-55404 (the
    # --write-*-link options wrote unsanitized attacker-controlled paths).
    "yt-dlp>=2026.7.4",
    "argostranslate>=1.9.0",
    "langdetect>=1.0.9",
    "qrcode[pil]>=7.4",
    "pyzbar>=0.1.9",
    "opencv-python-headless>=4.8.0",
    "pytesseract>=0.3.10",
