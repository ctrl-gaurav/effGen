    # verification path (`pip install -e ".[all]" && pytest tests/`) works.
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.2.0",
    "pytest-forked>=1.6.0",
    "pexpect>=4.9.0",
    "hypothesis>=6.100.0",
