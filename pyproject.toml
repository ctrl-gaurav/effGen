]

[tool.setuptools.dynamic]
version = {attr = "effgen.__version__"}

[tool.setuptools.packages.find]
# Ship ONLY the importable effgen package. An exclude-list let sub-packages of
# top-level repo dirs (examples.*, deploy.*, tools) leak into the wheel because
# the bare names didn't match their sub-packages; an allowlist is leak-proof.
include = ["effgen*"]
exclude = ["tests*", "examples*", "docs*", "scripts*", "deploy*"]

[tool.setuptools.package-data]
effgen = [
    "prompts/templates/*.yaml",
    "prompts/templates/*.json",
    "config/schemas/*.json",
    "config/schemas/*.yaml",
    "config/*.yaml",
    "config/*.json",
    "models/_data/*.json",
    "cli/_templates/plugin/*.tmpl",
    "bench/examples/*.yaml",
    "py.typed",
    "dashboard/static/*.html",
    "dashboard/static/*.js",
    "dashboard/static/*.css",
    "playground/static/*.html",
    "playground/static/*.js",
    "playground/static/*.css",
    "webui/static/*.js",
    "webui/static/*.css",
]

# Black - Code Formatter
[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

# isort - Import Sorter
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*", "*/build/*", "*/dist/*"]
known_first_party = ["effgen"]
known_third_party = [
    "torch",
    "transformers",
    "openai",
    "anthropic",
    "google",
    "yaml",
    "docker",
    "pytest",
]

# mypy - Type Checker
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
# Disabled: `# type: ignore` comments may appear "unused" on one Python/lib
# version but genuinely needed on another (optional-dep stubs, Python-version
# gated code). Enforcing this cross-version is flaky, so we trust the comment.
warn_unused_ignores = false
warn_no_return = true
# Unreachable-code warnings flap across Python/library versions (e.g. a sys.version
# branch mypy proves dead on one interpreter is live on another). Disabling here;
# dead code is caught by ruff (F) and tests.
warn_unreachable = false
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Per-module options
[[tool.mypy.overrides]]
module = [
    "vllm.*",
    "transformers.*",
    "anthropic.*",
    "google.generativeai.*",
    "duckduckgo_search.*",
    "docker.*",
    "faiss.*",
    "chromadb.*",
]
ignore_missing_imports = true

# Fully annotated modules: every function signature must stay complete. Extend
# this list as more subpackages reach full signature coverage.
[[tool.mypy.overrides]]
module = [
    "effgen",
    "effgen.completion",
    "effgen.errors",
    "effgen._env",
    "effgen._logging_setup",
    "effgen.cache.*",
    "effgen.dashboard.*",
    "effgen.playground.*",
    "effgen.presets.*",
    "effgen.webui.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# pytest - Testing Framework
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# NOTE: Coverage is intentionally NOT enabled in the default addopts. Enabling
# `--cov` globally made `pytest --collect-only` spin up the coverage machinery
# and, worse, made two parallel pytest shards race the single default `.coverage`
# SQLite file ("no such table: meta"). Coverage is now opt-in: pass `--cov=effgen
# --cov-report=...` on the jobs that want it, or use `scripts/run_coverage.sh`
# (unique COVERAGE_FILE per shard + `coverage combine`). See docs/guides/testing.md.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    # Keep ordering fixed by default so every lane is reproducible even when
    # pytest-randomly (in the dev extra) is installed. The dedicated
    # order-independence lane shuffles explicitly; to fuzz ordering locally,
    # drop this via `-o "addopts=" -p randomly`. See docs/guides/testing.md.
    "-p", "no:randomly",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gpu: marks tests that require a GPU",
    "api: marks tests that require API keys",
    "docker: marks tests that require Docker",
    "live: marks tests that make live API calls (deselect with '-m \"not live\"')",
    "deployment: marks deployment-recipe tests (Docker/Helm/Lambda/Cloudflare/probes)",
    "security: marks security tests (sandbox, SSRF, secret-scan, vuln-audit, supply-chain)",
    "expensive: marks long/heavy tests (soak, stress, large GPU runs) — deselect by default in CI",
    "cookbook: marks cookbook snippet tests",
    "reliability: marks reliability-primitive tests (timeouts, retry, circuit, bulkhead)",
    "fuzz: marks fuzz-harness tests (hypothesis-driven)",
]
asyncio_mode = "auto"
timeout = 120
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# Coverage - Code Coverage
[tool.coverage.run]
source = ["effgen"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/examples/*",
]
branch = true
# parallel=true makes each process write a uniquely-suffixed data file
# (.coverage.<host>.<pid>.<rand>) so concurrent shards never clobber a shared
# SQLite DB; combine them with `coverage combine` before reporting. relative_files
# keeps paths portable across the per-shard temp envs used by the install matrix.
parallel = true
relative_files = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# Pylint - Linter
[tool.pylint.main]
py-version = "3.11"
ignore = ["CVS", "migrations", "tests"]
jobs = 0  # Auto-detect CPUs

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "W0212",  # protected-access
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 10
max-attributes = 15

# Bandit - Security Linter
[tool.bandit]
exclude_dirs = ["/tests", "/examples"]
skips = ["B101", "B601"]  # Skip assert_used and paramiko_calls

# Ruff - Fast Python Linter (alternative to flake8)
[tool.ruff]
line-length = 100
# Must equal the `requires-python` floor above. Several pyupgrade rules are
# version-gated and fire only at a higher target, and their rewrites do not run
# on an older interpreter, so raising the target ahead of the floor would make
# ruff demand syntax the declared floor cannot execute. The floor moved to 3.11
# for 1.0.0, which turns on UP017 (`datetime.UTC`), UP041 (`TimeoutError`) and
# UP042 (`enum.StrEnum`); UP047 (PEP 695 generics) stays off until the floor
# reaches 3.12. tests/unit/test_static_check_ratchet.py keeps the two in step.
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ISC", # flake8-implicit-str-concat
    "FLY", # flynt (str.join of literals -> f-string)
    "LOG", # flake8-logging
    "T10", # flake8-debugger (no stray breakpoints)
    "YTT", # flake8-2020 (sys.version misuse)
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "B028",   # stacklevel in warnings.warn (pre-existing)
    "B904",   # raise ... from err (pre-existing, too many to fix in patch)
    "B905",   # zip() without strict= (pre-existing)
    "C901",   # too complex
    "UP037",  # quoted annotations (pre-existing, cosmetic)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Ignore unused imports in __init__.py
# Examples and validation scripts call load_dotenv() before effgen imports so
# env-dependent modules see the keys at import time — the E402 is intentional.
"examples/**/*.py" = ["E402"]
"scripts/**/*.py" = ["E402"]
"validation/**/*.py" = ["E402"]
"tests/conftest.py" = ["E402"]  # sys.path manipulation must precede effgen imports
# The scorers and tools under this directory are byte-for-byte copies of the
# harness that produced the benchmark records they are used to re-read. They are
# copies on purpose — a reformatted parser is a changed parser, and a changed
# parser changes the numbers for reasons that have nothing to do with effGen —
# so they are linted as data rather than as source. A drift check in the same
# directory compares them against their origin.
"tests/benchmarks/agentloop/harness/**" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["effgen"]

# Pydocstyle - Docstring Checker
[tool.pydocstyle]
convention = "google"
add-ignore = ["D100", "D104", "D105", "D107"]
match = "(?!test_).*\\.py"
match-dir = "^(?!(tests|examples|docs)).*"
