    "matplotlib>=3.7.0",
    "plotly>=5.18.0",
    "rouge-score>=0.1.2",
    "nltk>=3.8.0",
    "llama-cpp-python>=0.2.0",
    "cerebras-cloud-sdk>=1.0",
